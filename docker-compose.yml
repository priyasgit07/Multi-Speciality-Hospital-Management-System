version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: medicare_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable must be set}
      MYSQL_DATABASE: hospital_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./hospital-backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./hospital-backend
      dockerfile: Dockerfile
    container_name: medicare_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://db:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable must be set}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:80,http://127.0.0.1:3000"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./reactapp
      dockerfile: Dockerfile
    container_name: medicare_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
